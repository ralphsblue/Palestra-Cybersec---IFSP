# Bloco nginx para o site do sorteio (demo CyberSec IFSP).
# Instalar em: /etc/nginx/sites-available/sorteio  e linkar em sites-enabled.
# Depois rodar certbot --nginx para ele adicionar o 443 + redirect automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name instituto-federal-birigui.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # Preserva host e IP real do visitante (o app usa X-Forwarded-For pra geo por IP)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
